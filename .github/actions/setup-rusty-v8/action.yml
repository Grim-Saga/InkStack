name: setup-rusty-v8
description: Download and verify InkStack-built rusty_v8 artifacts for Cargo builds.
inputs:
  target:
    description: Rust target triple with InkStack-built V8 release artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Configure rusty_v8 artifact overrides and verify checksums
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_WORKSPACE}/.github/scripts/fetch_rusty_v8.py" \
          --target "${TARGET}" \
          --cache-root "${RUNNER_TEMP}/rusty_v8" \
          --github-env "${GITHUB_ENV}"
