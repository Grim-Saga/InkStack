[package]
edition.workspace = true
license.workspace = true
name = "inkstack-analytics"
version.workspace = true

[lib]
doctest = false
name = "inkstack_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
inkstack-http-client = { workspace = true }
inkstack-app-server-protocol = { workspace = true }
inkstack-git-utils = { workspace = true }
inkstack-login = { workspace = true }
inkstack-model-provider = { workspace = true }
inkstack-plugin = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-state = { workspace = true }
inkstack-utils-path-uri = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
inkstack-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
