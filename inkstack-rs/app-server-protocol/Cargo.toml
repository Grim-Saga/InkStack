[package]
name = "inkstack-app-server-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "inkstack_app_server_protocol"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
inkstack-experimental-api-macros = { workspace = true }
inkstack-app-server-protocol-noop-macros = { workspace = true }
inkstack-extension-items = { workspace = true }
inkstack-history = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-rollout = { workspace = true }
inkstack-secrets = { workspace = true }
inkstack-shell-command = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-path-uri = { workspace = true }
inkstack-utils-redacted-string = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "server",
] }
inventory = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
zstd = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
inkstack-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
schemars = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
ts-rs = { workspace = true }
