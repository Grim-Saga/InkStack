[package]
name = "inkstack-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "inkstack-app-server"
path = "src/main.rs"

[[bin]]
name = "inkstack-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "inkstack_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
inkstack-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
inkstack-analytics = { workspace = true }
inkstack-agent-extension = { workspace = true }
inkstack-arg0 = { workspace = true }
inkstack-aws-auth = { workspace = true }
inkstack-cloud-config = { workspace = true }
inkstack-code-mode = { workspace = true }
inkstack-config = { workspace = true }
inkstack-network-proxy = { workspace = true }
inkstack-connectors = { workspace = true }
inkstack-core = { workspace = true }
inkstack-core-plugins = { workspace = true }
inkstack-diagnostics = { workspace = true }
inkstack-home = { workspace = true }
inkstack-exec-server = { workspace = true }
inkstack-extension-api = { workspace = true }
inkstack-external-agent-migration = { workspace = true }
inkstack-features = { workspace = true }
inkstack-goal-extension = { workspace = true }
inkstack-git-attribution = { workspace = true }
inkstack-guardian-v2 = { workspace = true }
inkstack-git-utils = { workspace = true }
inkstack-file-watcher = { workspace = true }
inkstack-hooks = { workspace = true }
inkstack-history-notes-extension = { workspace = true }
inkstack-http-client = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-plugin = { workspace = true }
inkstack-shell-command = { workspace = true }
inkstack-skills = { workspace = true }
