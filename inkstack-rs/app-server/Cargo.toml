inkstack-backend-client = { workspace = true }
inkstack-file-search = { workspace = true }
inkstack-chatgpt = { workspace = true }
inkstack-login = { workspace = true }
inkstack-image-generation-extension = { workspace = true }
inkstack-memories-extension = { workspace = true }
inkstack-web-search-extension = { workspace = true }
inkstack-websocket-auth = { workspace = true }
