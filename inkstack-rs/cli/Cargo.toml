[package]
name = "inkstack-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "inkstack"

[[bin]]
name = "inkstack"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[[test]]
name = "app_server_daemon_package"
path = "tests/app_server_daemon/package.rs"

[lib]
name = "inkstack_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
inkstack-utils-process = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
inkstack-app-server = { workspace = true }
inkstack-app-server-daemon = { workspace = true }
inkstack-app-server-protocol = { workspace = true }
inkstack-app-server-test-client = { workspace = true }
inkstack-arg0 = { workspace = true }
inkstack-build-info = { workspace = true }
inkstack-api = { workspace = true }
inkstack-aws-auth = { workspace = true }
inkstack-chatgpt = { workspace = true }
inkstack-cloud-config = { workspace = true }
inkstack-cloud-tasks = { path = "../cloud-tasks" }
inkstack-utils-cli = { workspace = true }
inkstack-config = { workspace = true }
inkstack-core = { workspace = true }
inkstack-core-plugins = { workspace = true }
inkstack-history = { workspace = true }
inkstack-home = { workspace = true }
inkstack-http-client = { workspace = true }
inkstack-exec = { workspace = true }
inkstack-exec-server = { workspace = true }
inkstack-execpolicy = { workspace = true }
inkstack-extension-api = { workspace = true }
inkstack-features = { workspace = true }
inkstack-git-attribution = { workspace = true }
inkstack-git-utils = { workspace = true }
inkstack-install-context = { workspace = true }
inkstack-login = { workspace = true }
inkstack-memories-write = { workspace = true }
inkstack-mcp = { workspace = true }
inkstack-model-provider = { workspace = true }
inkstack-models-manager = { workspace = true }
inkstack-plugin = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-responses-api-proxy = { workspace = true }
inkstack-tcp-tunnel = { workspace = true }
inkstack-rmcp-client = { workspace = true }
inkstack-rollout = { workspace = true }
inkstack-rollout-trace = { workspace = true }
inkstack-sandboxing = { workspace = true }
inkstack-skills-extension = { workspace = true }
inkstack-state = { workspace = true }
inkstack-stdio-to-uds = { workspace = true }
inkstack-terminal-detection = { workspace = true }
inkstack-thread-store = { workspace = true }
inkstack-tui = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-path = { workspace = true }
inkstack-utils-path-uri = { workspace = true }
inkstack-utils-redacted-string = { workspace = true }
inkstack-websocket-auth = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
inkstack_windows_sandbox = { package = "inkstack-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
inkstack-app-server-client = { workspace = true }
inkstack-utils-cargo-bin = { workspace = true }
inkstack-utils-pty = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
jsonwebtoken = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
vt100 = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
