[package]
name = "inkstack-cloud-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
inkstack-async-utils = { workspace = true }
inkstack-backend-client = { workspace = true }
inkstack-config = { workspace = true }
inkstack-http-client = { workspace = true }
inkstack-login = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-protocol = { workspace = true }
hmac = "0.12.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
inkstack-agent-identity = { workspace = true }
inkstack-core = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lib]
doctest = false
