[package]
edition.workspace = true
license.workspace = true
name = "inkstack-core"
version.workspace = true

[lib]
name = "inkstack_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
inkstack-utils-process = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
inkstack-analytics = { workspace = true }
inkstack-agent-graph-store = { workspace = true }
inkstack-agent-roles = { workspace = true }
inkstack-api = { workspace = true }
inkstack-app-server-protocol = { workspace = true }
inkstack-apply-patch = { workspace = true }
inkstack-async-utils = { workspace = true }
inkstack-attachment-store = { workspace = true }
inkstack-client = { workspace = true }
inkstack-code-mode = { workspace = true }
inkstack-connectors = { workspace = true }
inkstack-context-fragments = { workspace = true }
inkstack-config = { workspace = true }
inkstack-core-plugins = { workspace = true }
inkstack-diagnostics = { workspace = true }
inkstack-exec-server = { workspace = true }
inkstack-extension-api = { workspace = true }
inkstack-extension-items = { workspace = true }
inkstack-features = { workspace = true }
inkstack-feedback = { workspace = true }
inkstack-file-system = { workspace = true }
inkstack-login = { workspace = true }
inkstack-memories-read = { workspace = true }
inkstack-mcp = { workspace = true }
inkstack-model-provider-info = { workspace = true }
inkstack-models-manager = { workspace = true }
inkstack-shell-command = { workspace = true }
inkstack-execpolicy = { workspace = true }
inkstack-git-utils = { workspace = true }
inkstack-guardian-context = { workspace = true }
inkstack-guardian-reviewer = { workspace = true }
inkstack-history = { workspace = true }
inkstack-hooks = { workspace = true }
inkstack-http-client = { workspace = true }
inkstack-install-context = { workspace = true }
inkstack-network-proxy = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-plugin = { workspace = true }
inkstack-model-provider = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-response-debug-context = { workspace = true }
inkstack-prompts = { workspace = true }
inkstack-rollout = { workspace = true }
inkstack-rollout-trace = { workspace = true }
inkstack-rmcp-client = { workspace = true }
inkstack-sandboxing = { workspace = true }
inkstack-skills = { workspace = true }
inkstack-skills-extension = { workspace = true }
inkstack-state = { workspace = true }
inkstack-agent-message-board-extension = { workspace = true }
inkstack-agent-message-board-client = { workspace = true }
inkstack-terminal-detection = { workspace = true }
inkstack-thread-store = { workspace = true }
inkstack-tools = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-audio = { workspace = true }
inkstack-utils-cache = { workspace = true }
inkstack-utils-git-discovery = { workspace = true }
inkstack-utils-image = { workspace = true }
inkstack-utils-home-dir = { workspace = true }
inkstack-utils-output-truncation = { workspace = true }
inkstack-utils-path = { workspace = true }
inkstack-utils-path-uri = { workspace = true }
inkstack-utils-plugins = { workspace = true }
inkstack-utils-pty = { workspace = true }
inkstack-utils-string = { workspace = true }
inkstack-utils-stream-parser = { workspace = true }
inkstack-windows-sandbox = { package = "inkstack-windows-sandbox", path = "../windows-sandbox-rs" }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tonic = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
inkstack-exec-server-test-support = { workspace = true }
inkstack-image-generation-extension = { workspace = true }
inkstack-home = { workspace = true }
inkstack-mcp-extension = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-test-binary-support = { workspace = true }
inkstack-utils-cargo-bin = { workspace = true }
inkstack-utils-redacted-string = { workspace = true }
inkstack-web-search-extension = { workspace = true }
inkstack-windows-sandbox-test-support = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
