[package]
edition.workspace = true
license.workspace = true
name = "inkstack-extension-api"
version.workspace = true

[lib]
name = "inkstack_extension_api"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
inkstack-api = { workspace = true }
futures = { workspace = true }
inkstack-guardian-context = { workspace = true }
inkstack-history = { workspace = true }
inkstack-config = { workspace = true }
inkstack-context-fragments = { workspace = true }
inkstack-exec-server-protocol = { workspace = true }
inkstack-file-system = { workspace = true }
inkstack-mcp = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-tools = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-path-uri = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
