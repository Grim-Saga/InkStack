[package]
edition.workspace = true
license.workspace = true
name = "inkstack-guardian-reviewer"
version.workspace = true

[lib]
doctest = false
name = "inkstack_guardian_reviewer"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
inkstack-analytics = { workspace = true }
inkstack-extension-api = { workspace = true }
inkstack-feedback = { workspace = true }
inkstack-guardian-context = { workspace = true }
inkstack-mcp = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-prompts = { workspace = true }
inkstack-protocol = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["experimental_metrics_custom_reader", "metrics"] }
test-case = "3.3.1"
pretty_assertions = { workspace = true }
