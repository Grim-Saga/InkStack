[package]
edition.workspace = true
license.workspace = true
name = "inkstack-memories-extension"
version.workspace = true

[lib]
name = "inkstack_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
inkstack-core = { workspace = true }
inkstack-extension-api = { workspace = true }
inkstack-features = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-tools = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-output-truncation = { workspace = true }
inkstack-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
