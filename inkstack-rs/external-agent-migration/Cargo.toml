inkstack-core-plugins = { workspace = true }
inkstack-hooks = { workspace = true }
inkstack-login = { workspace = true }
inkstack-memories-write = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-plugin = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-rollout = { workspace = true }
inkstack-thread-store = { workspace = true }
inkstack-utils-output-truncation = { workspace = true }
linkify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
inkstack-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
