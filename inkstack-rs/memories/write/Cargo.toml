[package]
edition.workspace = true
license.workspace = true
name = "inkstack-memories-write"
version.workspace = true

[lib]
name = "inkstack_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
inkstack-backend-client = { workspace = true }
inkstack-core = { workspace = true }
inkstack-config = { workspace = true }
inkstack-features = { workspace = true }
inkstack-git-utils = { workspace = true }
inkstack-login = { workspace = true }
inkstack-model-provider = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-rollout = { workspace = true }
inkstack-rollout-trace = { workspace = true }
inkstack-secrets = { workspace = true }
inkstack-state = { workspace = true }
inkstack-terminal-detection = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-output-truncation = { workspace = true }
inkstack-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
inkstack-model-provider-info = { workspace = true }
inkstack-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
