[package]
edition.workspace = true
license.workspace = true
name = "inkstack-model-provider"
version.workspace = true

[lib]
doctest = false
name = "inkstack_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
inkstack-utils-process = { workspace = true }
chrono = { workspace = true }
inkstack-api = { workspace = true }
inkstack-agent-identity = { workspace = true }
inkstack-aws-auth = { workspace = true }
inkstack-http-client = { workspace = true }
inkstack-feedback = { workspace = true }
inkstack-login = { workspace = true }
inkstack-keyring-store = { workspace = true }
inkstack-model-provider-info = { workspace = true }
inkstack-models-manager = { workspace = true }
inkstack-otel = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-response-debug-context = { workspace = true }
inkstack-secrets = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
inkstack-utils-cargo-bin = { workspace = true }
inkstack-utils-redacted-string = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
