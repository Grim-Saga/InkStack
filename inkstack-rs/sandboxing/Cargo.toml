[package]
name = "inkstack-sandboxing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "inkstack_sandboxing"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
inkstack-mxc-sandbox = { workspace = true }
inkstack-network-proxy = { workspace = true }
inkstack-protocol = { workspace = true }
inkstack-uds = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-path-uri = { workspace = true }
inkstack-utils-pty = { workspace = true }
inkstack-windows-sandbox = { workspace = true }
dunce = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
regex-lite = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(windows)'.dependencies]
inkstack-otel = { workspace = true }
inkstack-utils-home-dir = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
inkstack-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
