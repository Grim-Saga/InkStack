[package]
build = "build.rs"
edition.workspace = true
license.workspace = true
name = "inkstack-windows-sandbox"
version.workspace = true

[lib]
name = "inkstack_windows_sandbox"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "inkstack-windows-sandbox-setup"
path = "src/bin/setup_main/main.rs"

[[bin]]
name = "inkstack-command-runner"
path = "src/bin/command_runner/main.rs"

[[bin]]
name = "inkstack-windows-managed-deny-probe"
path = "src/bin/managed_deny_probe/main.rs"

[lints]
workspace = true

[dependencies]
inkstack-utils-process = { workspace = true }
inkstack-http-client = { workspace = true }
anyhow = "1.0"
base64 = { workspace = true }
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "std",
] }
inkstack-utils-pty = { workspace = true }
inkstack-utils-absolute-path = { workspace = true }
inkstack-utils-string = { workspace = true }
inkstack-otel = { workspace = true }
dunce = "1.0"
glob = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { workspace = true, features = ["sync", "rt", "macros", "signal", "time"] }
tracing-appender = { workspace = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[dependencies.inkstack-protocol]
package = "inkstack-protocol"
path = "../protocol"

[dependencies.rand]
default-features = false
features = ["std", "small_rng"]
version = "0.8"

[dependencies.dirs-next]
version = "2.0"

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Services",
]
workspace = true

[dev-dependencies]
inkstack-utils-cargo-bin = { workspace = true }
inkstack-windows-sandbox-test-support = { workspace = true }
pretty_assertions = { workspace = true }
